name: kEngram PR gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: kEngram PR gate
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - kengram
      - yeti-mini
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Format gate
        run: cargo fmt --all -- --check

      - name: Workspace check
        run: cargo check --workspace

      - name: Schema gate self-test
        run: ./scripts/schema-binary-migrate-gate-selftest.sh
